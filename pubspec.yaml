name: walletflow_app_movil
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  # Localizaciones de Flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase Core (requerido para todos los productos Firebase)
  firebase_core: ^3.6.0
  
  # Firebase Authentication
  firebase_auth: ^5.3.1
  
  # Cloud Firestore (base de datos)
  cloud_firestore: ^5.4.3
  
  # Firebase Cloud Messaging (notificaciones)
  firebase_messaging: ^15.1.3
  
  # Firebase Storage (almacenamiento de archivos)
  firebase_storage: ^12.3.2
  
  # Image Picker (seleccionar imágenes)
  image_picker: ^1.0.4
  
  # Permisos
  permission_handler: ^11.3.1
  table_calendar: ^3.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  
  # Notificaciones locales
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  
  # Internacionalización y formateo
  intl: ^0.20.2
  # Export / sharing utilities
  pdf: ^3.10.1
  printing: ^5.10.4
  excel: ^2.0.4
  path_provider: ^2.0.15
  share_plus: ^10.0.3
  
  # URL Launcher for email functionality
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  
  # Assets de la aplicación
  assets:
    - images/

# Configuración del ícono de la aplicación
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/logo.png"
  min_sdk_android: 21
  
  # Configuración para íconos adaptativos (Android modernos)
  adaptive_icon_background: "#FFFFFF"  # Color de fondo blanco
  adaptive_icon_foreground: "images/logo.png"  # Tu ícono como primer plano
  
  web:
    generate: true
    image_path: "images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#2196F3"
  windows:
    generate: true
    image_path: "images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "images/logo.png"
