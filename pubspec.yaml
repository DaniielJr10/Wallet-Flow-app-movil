name: walletflow_app_movil
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core (requerido para todos los productos Firebase)
  firebase_core: ^3.6.0
  
  # Firebase Authentication
  firebase_auth: ^5.3.1
  
  # Cloud Firestore (base de datos)
  cloud_firestore: ^5.4.3
  
  # Firebase Cloud Messaging (notificaciones)
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Assets de la aplicación
  assets:
    - images/
